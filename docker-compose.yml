services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finddex
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # SQLite is single-writer. Serialize Prisma access and wait longer for
      # short write locks during demo seed/import/reset operations.
      DATABASE_URL: file:/app/data/dev.db?connection_limit=1&socket_timeout=30
      UPLOADS_DIR: /app/public/uploads
      BACKUPS_DIR: /app/data/backups
      INTERNAL_BASE_URL: http://127.0.0.1:3000
      BACKUP_INTERVAL_MS: "${BACKUP_INTERVAL_MS:-}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    ports:
      - "${APP_PORT:-12000}:3000"
    volumes:
      - "${MODELVAULT_DATA_DIR:-modelvault_data}:/app/data"
      - "${MODELVAULT_UPLOADS_DIR:-modelvault_uploads}:/app/public/uploads"

volumes:
  modelvault_data:
  modelvault_uploads:
